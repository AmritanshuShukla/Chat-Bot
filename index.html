<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Learning Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <div class="logo">DS</div>
                <div class="header-text">
                    <h1>DSA Learning Chatbot</h1>
                    <p id="statusMsg"><a href="#" onclick="checkModels(); return false;"
                            style="color: #769371; text-decoration: underline;">Run System Check</a></p>
                </div>
            </div>
            <button class="clear-btn" onclick="clearHistory()">Clear History</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-message">
                <h2>Welcome! 👋</h2>
                <p>I'm your DSA instructor. Ask me anything about Data Structures and Algorithms!</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask about DSA concepts..." autocomplete="off">
            </div>
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_KEY = ""; // enter the api key
        const SYSTEM_PROMPT = "You are a Data Structure and Algorithm(DSA) instructor. Answer questions which are related to DSA only, for other queries respond by saying ask relevant question. Answer the question in an easy way, make it easier for the user to understand the answer. Provide clear explanations with examples when helpful.";
        const MODEL_CANDIDATES = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-flash-latest"];

        let conversationHistory = [];

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('userInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        async function checkModels() {
            addMessage("Checking available models for your key...", 'bot');
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                const data = await response.json();
                if (data.models) {
                    const names = data.models.map(m => m.name.replace('models/', '')).join(", ");
                    addMessage("Available Models: " + names, 'bot');
                } else {
                    addMessage("No models found: " + JSON.stringify(data), 'bot');
                }
            } catch (e) {
                addMessage("Check failed: " + e.message, 'bot');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';
            document.getElementById('sendBtn').disabled = true;
            showLoading();

            try {
                const fullHistory = [
                    ...conversationHistory,
                    { role: "user", parts: [{ text: message }] }
                ];

                let lastError = "Unable to reach the AI service.";
                for (const model of MODEL_CANDIDATES) {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                            contents: fullHistory
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        lastError = data?.error?.message || `HTTP ${response.status}`;
                        if (lastError.includes('not found') || lastError.includes('unsupported') || response.status === 404) {
                            continue;
                        }
                        throw new Error(lastError);
                    }

                    const botResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!botResponse) throw new Error('The AI response was empty.');

                    removeLoading();
                    addMessage(botResponse, 'bot');

                    conversationHistory.push({ role: "user", parts: [{ text: message }] });
                    conversationHistory.push({ role: "model", parts: [{ text: botResponse }] });
                    return;
                }

                throw new Error(lastError);
            } catch (error) {
                removeLoading();
                addMessage(`Critical Error: ${error.message}`, 'bot');
            } finally {
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function addMessage(text, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const welcome = chatContainer.querySelector('.welcome-message');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = formatMessage(text);
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatMessage(text) {
            text = text.replace(/```(\w+)?\n([\s\S]+?)```/g, '<pre><code>$2</code></pre>');
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\n/g, '<br>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            return text;
        }

        function showLoading() {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message bot';
            div.id = 'loadingMessage';
            div.innerHTML = `<div class="message-content"><div class="loading"><span></span><span></span><span></span></div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeLoading() {
            const load = document.getElementById('loadingMessage');
            if (load) load.remove();
        }

        function clearHistory() {
            if (confirm("Reset chat?")) location.reload();
        }
    </script>
</body>

</html>
